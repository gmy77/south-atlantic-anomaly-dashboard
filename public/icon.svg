<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>SAA Observatory</title>
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#16243d"/>
      <stop offset="1" stop-color="#060911"/>
    </radialGradient>
    <radialGradient id="globe" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#1d3a63"/>
      <stop offset="1" stop-color="#0a1426"/>
    </radialGradient>
    <radialGradient id="saa" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff5c7a"/>
      <stop offset="0.45" stop-color="#f43f5e" stop-opacity="0.85"/>
      <stop offset="0.8" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><circle cx="32" cy="33" r="17"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- linee del campo dipolare: escono da un polo e rientrano dall'altro -->
  <g fill="none" stroke="#00e5ff" stroke-linecap="round">
    <path d="M28 17.5 C 16 6, 4 16, 4 33 C 4 50, 16 60, 28 48.5" stroke-width="1.8" opacity="0.9"/>
    <path d="M36 17.5 C 48 6, 60 16, 60 33 C 60 50, 48 60, 36 48.5" stroke-width="1.8" opacity="0.9"/>
    <path d="M30 16.5 C 22 1, 11 7, 9.5 33 C 11 59, 22 65, 30 49.5" stroke-width="1.2" opacity="0.45"/>
    <path d="M34 16.5 C 42 1, 53 7, 54.5 33 C 53 59, 42 65, 34 49.5" stroke-width="1.2" opacity="0.45"/>
  </g>
  <!-- globo -->
  <circle cx="32" cy="33" r="17" fill="url(#globe)" stroke="#3a5a8c" stroke-width="1"/>
  <g clip-path="url(#clip)">
    <!-- Sud America e Africa stilizzate -->
    <path d="M21 24 q4 -2 8 0 q4 2 3 6 q-1 4 -4 8 q-2 4 -3 9 q-2 -2 -2 -6 q-1 -5 -3 -9 q-1 -5 1 -8 z" fill="#2f5288"/>
    <path d="M37 21 q5 -1 9 1 q4 3 2 7 q-1 3 -3 7 q-2 4 -4 6 q-2 -3 -2 -7 q-1 -3 -3 -5 q-1 -5 1 -9 z" fill="#2f5288"/>
    <!-- anomalia -->
    <ellipse cx="30" cy="38" rx="11" ry="7" fill="url(#saa)"/>
    <ellipse cx="30" cy="38" rx="4.5" ry="3" fill="none" stroke="#fde68a" stroke-width="0.9"/>
    <path d="M14 33 h36 M32 16 v34" stroke="#3a5a8c" stroke-width="0.5" opacity="0.7"/>
  </g>
  <!-- freccia di deriva verso ovest -->
  <path d="M27 38 h-9 m3 -2.5 l-3 2.5 3 2.5" fill="none" stroke="#10b981" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
